# Hoplab у себя на ПК: Postgres, сервис и интерфейс — те же образы, что на сервере, только собранные из исходников.
# Из папки hoplab/service:
#   docker compose up -d db           только база — для сервиса из .venv (python -m app) и web (npm run dev)
#   docker compose up -d --build      всё: интерфейс — http://127.0.0.1:3000, API — http://127.0.0.1:8000
#   docker compose logs -f service    журнал сервиса (web — интерфейса)
#   docker compose down               остановить (данные базы остаются в томе pgdata)
# Агент пивоварни — отдельно: agent/compose.yaml.
name: hoplab

services:
  db:
    image: postgres:17-alpine
    container_name: hoplab-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hoplab
      POSTGRES_USER: hoplab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      # только этот ПК — чтобы сервис из .venv и тесты тоже могли подключиться
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoplab -d hoplab"]
      interval: 5s
      timeout: 3s
      retries: 10

  service:
    build: .
    image: hoplab-service
    container_name: hoplab-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hoplab:${POSTGRES_PASSWORD}@db:5432/hoplab

  web:
    build: ../web
    image: hoplab-web
    container_name: hoplab-web
    restart: unless-stopped
    depends_on:
      service:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NUXT_API_SERVER: http://service:8000

volumes:
  pgdata:
