# Проверка на каждый пуш и pull request (Python: сервис и агент; Node: интерфейс, api, core; секреты).
# Образы (сервис, интерфейс, api) собираются на каждой проверке, включая pull request, — сломанный Dockerfile
# ловится до слияния; публикуются в ghcr и выкатываются на сервер по SSH только из main. Сервер и его настройка — deploy/README.md. Секреты репозитория: DEPLOY_HOST, DEPLOY_SSH_KEY
# (ключ пользователя deploy на сервере), DEPLOY_KNOWN_HOSTS (отпечаток сервера), DEPLOY_URL (адрес сайта).
name: Проверка и выкатка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  python:
    name: Сервис и агент
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hoplab
          POSTGRES_PASSWORD: hoplab
          POSTGRES_DB: hoplab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hoplab -d hoplab_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://hoplab:hoplab@127.0.0.1:5432/hoplab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            service/requirements*.txt
            agent/requirements*.txt
      - name: Зависимости
        run: pip install -r service/requirements-dev.txt -r agent/requirements-dev.txt
      - name: Линтер
        run: ruff check service agent shared
      - name: Тесты агента
        working-directory: agent
        run: pytest
      - name: Тесты сервиса
        working-directory: service
        run: pytest
      - name: Схема API в web совпадает с сервисом
        working-directory: service
        run: |
          python -m app openapi ../apps/web/openapi.json
          git diff --exit-code -- ../apps/web/openapi.json || { echo "::error::apps/web/openapi.json устарел — в apps/web: pnpm api:types"; exit 1; }

  node:
    name: Node (интерфейс, api, core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # версия pnpm — из packageManager в корневом package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # postinstall интерфейса (nuxt prepare) генерирует .nuxt: типы API из openapi.json и конфиг ESLint
      - run: pnpm install --frozen-lockfile
      - name: Линтер и границы
        run: pnpm lint
      # типы API генерирует nuxt-open-fetch из openapi.json; что он совпадает с сервисом, проверяет job «Сервис и агент»
      - name: Типы
        run: pnpm typecheck
      - name: Тесты core, api и интерфейса
        run: pnpm test
      - name: Мёртвый код (core и api)
        run: pnpm knip

  # audit и gitleaks — отдельные отметки в PR: красные, но срочную правку в main не держат (build.needs без них)
  audit:
    name: Уязвимости зависимостей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # без cache: pnpm — пакеты не ставятся (audit читает lock-файл), сохранять кэш нечего, и его шаг падает
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm audit --audit-level high

  gitleaks:
    name: Секреты в истории
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ложные срабатывания — в .gitleaksignore, с комментарием
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Образ ${{ matrix.name }}
    needs: [python, node]
    # собирается на каждой проверке; вход в ghcr и публикация (и тег latest) — только из main
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: сервиса, context: service, scope: service, dockerfile: service/Dockerfile, image: ghcr.io/sansay90/hoplab }
          - { name: интерфейса, context: ., scope: web, dockerfile: apps/web/Dockerfile, image: ghcr.io/sansay90/hoplab-web }
          - { name: api, context: ., scope: api, dockerfile: apps/api/Dockerfile, image: ghcr.io/sansay90/hoplab-api }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  deploy:
    name: Сервер
    needs: build
    # только из main; на pull_request job не запускается
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Доступ к серверу
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Выкатить
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scp -i ~/.ssh/deploy deploy/compose.yaml "deploy@$HOST:/opt/hoplab/compose.yaml"
          # образ закрытый: вход в реестр — токеном этой выкатки, после неё он уже недействителен и стирается
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy "deploy@$HOST" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin \
             && cd /opt/hoplab \
             && export APP_TAG=${{ github.sha }} \
             && docker compose pull app web \
             && docker compose up -d --remove-orphans \
             ; status=\$?; docker logout ghcr.io; docker image prune -f; exit \$status"
      - name: Сайт отвечает
        env:
          URL: ${{ secrets.DEPLOY_URL }}
        run: curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$URL/api/health"
